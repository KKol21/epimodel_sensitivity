name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install black==24.8.0 flake8==7.1.1
      - run: python -m black --check emsa emsa_examples tests scripts setup.py
      - run: python -m flake8 emsa emsa_examples tests scripts setup.py --ignore E501,W503,F401

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]"
          python -m pip check
      - name: Run tests and coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report -m

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.bump.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "build>=1.2,<2" "twine>=6.1,<7" bump2version==1.0.1
      # Record the new version in Git only after its built wheel passes the checks.
      - name: Prepare automatic patch release
        id: bump
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[bump]') &&
          contains(github.event.head_commit.message, '[publish]')
        run: bumpversion --no-commit --no-tag patch
      - name: Read version and check release tags
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != "v" + version:
                  raise SystemExit(f"Release tag must match package version: v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build sdist and wheel from this checkout
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  wheel-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Install and exercise wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/emsa-wheel"
          wheel_python="$RUNNER_TEMP/emsa-wheel/bin/python"
          "$wheel_python" -m pip install --upgrade pip
          "$wheel_python" -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          "$wheel_python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          "$wheel_python" -m pip check
          cd "$RUNNER_TEMP"
          "$wheel_python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  publish-to-pypi:
    needs: [build, wheel-smoke]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.build.outputs.bumped == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/emsa
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Commit and tag the tested release
        if: needs.build.outputs.bumped == 'true'
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install bump2version==1.0.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bumpversion --new-version "$RELEASE_VERSION" patch
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@release/v1
